name: Dependabot Auto-Merge
on: pull_request
permissions:
    contents: read
jobs:
    auto-merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'ldrick/trade-indicators'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        # approves and merges with the GitHub App token; GITHUB_TOKEN only reads the metadata
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: '${{ secrets.GITHUB_TOKEN }}'
            # Workflows triggered by Dependabot only see Dependabot secrets, so the private key is
            # stored there as well. The client ID is not secret.
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: Iv23liUIKgRttJORcCQs
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
            - name: Approve and auto-merge minor/patch updates
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-patch'
              run: |
                  gh pr review --approve "$PR_URL"
                  gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
