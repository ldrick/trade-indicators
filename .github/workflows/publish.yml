# Keep this file name: npm trusted publishing is bound to `publish.yml`.
name: Release
on:
    push:
        branches: [main]
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false
jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            - name: Create or update release pull request, release on merge
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
    test:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.x'
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm i --frozen-lockfile
            - name: Knip
              run: pnpm knip
            - name: Format Check
              run: pnpm format:check
            - name: Type Check
              run: pnpm types:check
            - name: Lint
              run: pnpm lint
            - name: Claude Lint
              run: pnpm lint:claude
            - name: Test
              run: pnpm test
            - name: Build
              run: pnpm build
            - name: Package Check
              run: pnpm package:check
    publish-npm:
        needs: [release-please, test]
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Setup Node.js for npmjs.org
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm i --frozen-lockfile
            - name: Build Package
              run: pnpm build
            - name: Publish Package to npmjs.org
              run: pnpm publish --access=public --no-git-checks --provenance
    publish-github-packages:
        needs: [release-please, test]
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Setup Node.js for Github Packages
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.x'
                  registry-url: 'https://npm.pkg.github.com'
                  scope: '@ldrick'
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm i --frozen-lockfile
            - name: Build Package
              run: pnpm build
            - name: Publish Package to Github Packages
              run: pnpm publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
