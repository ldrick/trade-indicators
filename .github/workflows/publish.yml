# Keep this file name: npm trusted publishing is bound to `publish.yml`.
name: Release
on:
    push:
        branches: [main]
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false
jobs:
    release-please:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
        steps:
            # Pull requests and pushes made with GITHUB_TOKEN do not trigger workflows, so the
            # required checks would never run on the release pull request. A GitHub App token does.
            - name: Create GitHub App token
              id: app-token
              if: vars.RELEASE_APP_CLIENT_ID != ''
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-issues: write
                  permission-pull-requests: write
            - name: Create or update release pull request, release on merge
              id: release
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
    test:
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Use Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.x'
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm i --frozen-lockfile
            - name: Knip
              run: pnpm knip
            - name: Format Check
              run: pnpm format:check
            - name: Type Check
              run: pnpm types:check
            - name: Lint
              run: pnpm lint
            - name: Claude Lint
              run: pnpm lint:claude
            - name: Test
              run: pnpm test
            - name: Build
              run: pnpm build
            - name: Package Check
              run: pnpm package:check
    publish-npm:
        needs: [release-please, test]
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - name: Setup Node.js for npmjs.org
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '26.x'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'
            - name: Install Dependencies
              run: pnpm i --frozen-lockfile
            - name: Build Package
              run: pnpm build
            - name: Publish Package to npmjs.org
              run: pnpm publish --access=public --no-git-checks --provenance
