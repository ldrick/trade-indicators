version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
      commit-message:
          prefix: 'ci'
      cooldown:
          default-days: 3
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      commit-message:
          prefix: 'chore'
      cooldown:
          default-days: 3
      groups:
          minor-and-patch:
              patterns: ['*']
              update-types: ['minor', 'patch']
